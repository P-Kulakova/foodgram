volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: on-failure
  backend:
    image: polinakul/foodgram_backend
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
    depends_on: 
      - db
    restart: on-failure
  frontend:
    env_file: .env
    image: polinakul/foodgram_frontend
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
  gateway:
    image: polinakul/foodgram_gateway
    env_file: .env
    ports:
      - 9080:80
    volumes:
      - static:/static
      - media:/media
    depends_on: 
      - backend
    restart: on-failure