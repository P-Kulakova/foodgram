[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/,
    data/,
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
known_first_party =
    api,
    foodgram,
    recipes,
    users
skip =
    venv,
    env
skip_glob =
    */migrations/*.py

[mypy]
plugins =
    mypy_django_plugin.main
ignore_missing_imports = True
follow_imports = silent
python_version = 3.12
strict_optional = True
show_error_codes = True

[mypy.plugins.django-stubs]
django_settings_module = "foodgram.settings"
